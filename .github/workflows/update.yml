name: Auto update site

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "build.py"
      - "fetch_auto.py"
      - "baidu_push.py"
      - "seo_config.json"
      - "fx.css"
      - "fx.js"
      - "vendor/**"
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch auto sources (self-healing)
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 fetch_auto.py
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "[heal] fetch_auto exited $code — continuing with previous data"
          fi
          exit 0

      - name: Build site (deep Baidu SEO)
        env:
          VERIFY_BAIDU: ${{ secrets.VERIFY_BAIDU }}
        run: python3 build.py

      - name: Baidu URL push (optional)
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: python3 baidu_push.py

      - name: Commit and push (GitHub Pages)
        run: |
          git config user.name "laohe-bot"
          git config user.email "9499758-wq@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "auto update $(TZ=Asia/Shanghai date '+%F %H:%M')"
            git push
          fi

      - name: Deploy to Netlify (ai168)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -e
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "[netlify] secrets missing — skip deploy"
            exit 0
          fi
          python3 << 'PY'
          import os, json, zipfile, urllib.request, io, time
          from pathlib import Path

          token = os.environ["NETLIFY_AUTH_TOKEN"]
          site = os.environ["NETLIFY_SITE_ID"]
          root = Path(".")
          skip_dirs = {".git", "__pycache__", ".github"}
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob("*"):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root).as_posix()
                  top = rel.split("/", 1)[0]
                  if top in skip_dirs or "/__pycache__/" in f"/{rel}/":
                      continue
                  if p.suffix == ".pyc":
                      continue
                  z.write(p, rel)
          data = buf.getvalue()
          print(f"[netlify] zip_bytes={len(data)}")
          req = urllib.request.Request(
              f"https://api.netlify.com/api/v1/sites/{site}/deploys",
              data=data,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/zip",
                  "User-Agent": "ai168-actions-deploy",
              },
          )
          with urllib.request.urlopen(req, timeout=180) as resp:
              out = json.loads(resp.read().decode())
          deploy_id = out.get("id")
          state = out.get("state")
          print(f"[netlify] deploy_id={deploy_id} state={state}")
          # poll until ready/error (max ~90s)
          for _ in range(30):
              time.sleep(3)
              req2 = urllib.request.Request(
                  f"https://api.netlify.com/api/v1/sites/{site}/deploys/{deploy_id}",
                  headers={"Authorization": f"Bearer {token}", "User-Agent": "ai168-actions-deploy"},
              )
              with urllib.request.urlopen(req2, timeout=60) as resp:
                  d = json.loads(resp.read().decode())
              state = d.get("state")
              print(f"[netlify] poll state={state}")
              if state in ("ready", "current"):
                  print("[netlify] published ok")
                  break
              if state in ("error", "failed"):
                  raise SystemExit(f"netlify deploy failed: {d.get('error_message')}")
          else:
              print("[netlify] still processing; deploy accepted")
          PY
